<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} | Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5 text-center">
                        
                        {% if product.image %}
                            <img src="{{ product.image.url }}" class="img-fluid rounded mb-4" alt="{{ product.name }}" style="max-height: 300px; object-fit: contain;">
                        {% else %}
                            <img src="https://via.placeholder.com/300x300?text=No+Image" class="img-fluid rounded mb-4" alt="No Image">
                        {% endif %}

                        <h1 class="text-capitalize fw-bold mb-2">{{ product.name }}</h1>
                        <h3 class="text-success fw-bold mb-4">${{ product.price }}</h3>
                        
                        <div class="bg-light rounded p-3 mb-4">
                            <p class="mb-0 text-muted">
                                Status: 
                                {% if product.stock > 0 %}
                                    <span class="badge bg-success">In Stock ({{ product.stock }})</span>
                                {% else %}
                                    <span class="badge bg-danger">Out of Stock</span>
                                {% endif %}
                            </p>
                        </div>

                        <div class="d-grid gap-2">
                            <a href="{% url 'add_to_cart' product.id %}" class="btn btn-primary btn-lg">Add to Cart</a>
                            <a href="{% url 'index' %}" class="btn btn-outline-secondary">Back to Catalog</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
