<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Django Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="#">My Tech Store</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-center mb-4">Product Catalog</h1>
        <div class="row justify-content-center mb-4">
    <div class="col-md-6">
        <form action="{% url 'index' %}" method="GET" class="d-flex">
            <input type="text" name="search" class="form-control me-2" placeholder="Search for products..." value="{{ request.GET.search }}">
            <button type="submit" class="btn btn-outline-primary">Search</button>
        </form>
    </div>
</div>
        
        <div class="row">
            {% for product in products %}
            <div class="col-md-4 mb-4">

                <div class="card-body text-center">
    {% if product.image %}
        <img src="{{ product.image.url }}" class="card-img-top mb-3" alt="{{ product.name }}" style="height: 180px; object-fit: contain;">
    {% else %}
        <img src="https://via.placeholder.com/180x180?text=No+Image" class="card-img-top mb-3" alt="No image available" style="height: 180px; object-fit: contain;">
    {% endif %}
      <h5 class="card-title">
                    <a href="{% url 'product_detail' product.pk %}" class="text-decoration-none text-dark fw-bold">
                        {{ product.name }}
                    </a>
                </h5>
                <p class="card-text text-success fw-bold">${{ product.price }}</p>
                <p class="card-text text-muted small">Available Stock: {{ product.stock }}</p>
                <a href="{% url 'add_to_cart' product.id %}" class="btn btn-primary w-100">Add to Cart</a>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12 text-center">
                <p class="alert alert-info">Your shop is empty! Go to the Admin panel to add products.</p>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
